<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome Sohaila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;1,500&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-a: #8f1a3f;
  --bg-b: #4a0a1f;
  --bg-c: #2b0511;
  --text: #fff1f4;
  --muted: #ffc9d6;
  --accent: #ffb3c6;
  --accent-text: #4a0a1f;
  --heart: #ff6b8e;
  --field: rgba(255, 255, 255, 0.1);
  --field-border: rgba(255, 201, 214, 0.5);
  --error: #ffd0d8;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg-a: #8f1a3f; --bg-b: #4a0a1f; --bg-c: #2b0511; }
}
:root[data-theme="dark"] { --bg-a: #8f1a3f; --bg-b: #4a0a1f; --bg-c: #2b0511; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--text);
  background: var(--bg-c);
  background-image: radial-gradient(ellipse at 50% 25%, var(--bg-a) 0%, var(--bg-b) 55%, var(--bg-c) 100%);
  background-attachment: fixed;
  font-family: "Lato", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  text-align: center;
  overflow-x: hidden;
}
main { position: relative; z-index: 1; width: 100%; max-width: 540px; }
h1 {
  margin: 0 0 18px;
  font-family: "Great Vibes", "Brush Script MT", cursive, Georgia, serif;
  font-weight: 400;
  font-size: clamp(3.4rem, 15vw, 6.6rem);
  line-height: 1.05;
  text-shadow: 0 4px 30px rgba(255, 107, 142, 0.45);
  animation: rise 1.1s ease-out both;
}
.beat { display: inline-block; color: var(--heart); font-family: system-ui, sans-serif; font-size: .6em; animation: beat 1.6s ease-in-out infinite; }
.sub {
  margin: 0 auto 10px;
  max-width: 28ch;
  font-family: "Playfair Display", Georgia, serif;
  font-style: italic;
  font-size: clamp(1.1rem, 4.2vw, 1.4rem);
  line-height: 1.55;
  color: var(--muted);
}
.hearts-row { margin: 0 0 32px; color: var(--heart); font-size: 1.3rem; letter-spacing: .5em; padding-left: .5em; }
.field { position: relative; }
input {
  width: 100%;
  padding: 16px 20px;
  font: inherit;
  font-size: 1.1rem;
  letter-spacing: 0.15em;
  text-align: center;
  color: var(--text);
  background: var(--field);
  border: 1px solid var(--field-border);
  border-radius: 999px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input::placeholder { color: var(--muted); letter-spacing: 0.05em; opacity: .8; }
input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 179, 198, 0.4); }
button {
  margin-top: 16px;
  width: 100%;
  padding: 15px 20px;
  font: inherit;
  font-size: 1.05rem;
  color: var(--accent-text);
  background: var(--accent);
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(255, 107, 142, 0.35);
}
button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
.error { min-height: 1.5em; margin: 14px 0 0; color: var(--error); font-size: .95rem; }
.shake { animation: shake .4s; }
main.letter { max-width: 600px; padding: 24px 0 40px; }
.clock { margin: 0; font-family: "Great Vibes", "Brush Script MT", cursive, Georgia, serif; font-size: clamp(3.4rem, 16vw, 6rem); line-height: 1.1; text-shadow: 0 4px 30px rgba(255, 107, 142, 0.45); animation: rise 1.1s ease-out both; }
.date { margin: 4px 0 28px; font-family: "Playfair Display", Georgia, serif; font-size: clamp(1.3rem, 5vw, 1.7rem); letter-spacing: .12em; color: var(--accent); }
.msg p { margin: 0 0 20px; font-size: clamp(1rem, 3.8vw, 1.12rem); line-height: 1.85; color: var(--text); }
.msg .more { font-family: "Playfair Display", Georgia, serif; font-style: italic; color: var(--muted); margin-top: 28px; }
.msg .love { margin-top: 28px; font-family: "Playfair Display", Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(2rem, 9vw, 3rem); letter-spacing: .08em; line-height: 1.2; color: var(--text); text-shadow: 0 0 24px rgba(255, 107, 142, 0.6); }
.msg { animation: rise 1.4s .3s ease-out both; }
.float { position: fixed; bottom: -40px; z-index: 0; color: var(--heart); opacity: 0; pointer-events: none; animation: floatUp linear infinite; }
@keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: .5; } 90% { opacity: .3; } 100% { transform: translateY(-115vh) rotate(25deg); opacity: 0; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.25); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { h1, .shake, .beat { animation: none; } .float { display: none; } }

.memories { margin-top: 40px; animation: rise 1.4s .6s ease-out both; }
.cap { margin: 0 auto 8px; max-width: 30ch; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: clamp(1.1rem, 4.4vw, 1.4rem); line-height: 1.6; color: var(--text); }
.hint { margin: 0 0 22px; font-size: .9rem; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cards .card { position: relative; width: 100%; margin: 0; padding: 0; aspect-ratio: 3 / 4; overflow: hidden; border: 1px solid var(--field-border); border-radius: 18px; background: linear-gradient(160deg, var(--bg-a), var(--bg-b)); cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
.card .h { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; font-size: 2.4rem; color: var(--heart); animation: beat 1.6s ease-in-out infinite; transition: opacity .4s, transform .4s; }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; opacity: 0; transform: scale(1.1); transition: opacity .8s, transform .8s; }
.card.open img { opacity: 1; transform: none; }
.card.open .h { animation: none; opacity: 0; transform: scale(.4); }
.song { margin-top: 40px; }
.final { margin-top: 44px; padding: 32px 4px 16px; border-top: 1px solid var(--field-border); }
.final p { margin: 0; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: clamp(1.1rem, 4.2vw, 1.3rem); line-height: 1.9; color: var(--text); text-shadow: 0 0 24px rgba(255, 107, 142, 0.35); }
.song .songcap { margin: 0 0 18px; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: clamp(1.1rem, 4.4vw, 1.4rem); line-height: 1.6; color: var(--text); }
.song .songbtn { width: 100%; margin: 0; padding: 16px 20px; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--text); background: var(--field); border: 1px solid var(--field-border); border-radius: 999px; box-shadow: none; }
.songbtn .h2 { color: var(--heart); font-family: system-ui, sans-serif; font-size: 1.4rem; animation: beat 1.6s ease-in-out infinite; }
.songframe iframe { display: block; width: 100%; height: 152px; margin-top: 16px; border: 0; border-radius: 14px; }
.songlink { display: inline-block; margin-top: 12px; color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .card .h, .memories, .songbtn .h2 { animation: none; } }
</style>
</head>

<main>
